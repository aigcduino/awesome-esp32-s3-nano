# Single source of truth for the awesome list.
# README.md (English) and README.zh-CN.md (Chinese) are generated from this file.
# Run `python3 scripts/build.py` after editing; CI fails if the READMEs drift.

meta:
  board: Wireless-tag WT9932S3-NANO
  also_compatible: Arduino Nano ESP32
  star_snapshot: 2026-11-05 # see data/stars.json

# Order here = order in the README.
sections:
  - id: board-support
    en: Board support & cores
    zh: 板级支持与核心
  - id: idf
    en: ESP-IDF board support
    zh: ESP-IDF 板级支持
  - id: toolchain
    en: Toolchain & flashing
    zh: 工具链与烧录
  - id: firmware
    en: Ready-to-flash firmware
    zh: 开箱即用的固件
  - id: projects
    en: Projects & examples
    zh: 项目与示例
  - id: libraries
    en: Libraries
    zh: 常用库
  - id: simulation
    en: Simulation & emulation
    zh: 仿真与模拟
  - id: hardware
    en: Hardware, docs & vendor support
    zh: 硬件、文档与厂商支持
  - id: siblings
    en: Compatible & sibling boards
    zh: 兼容板与近亲板

projects:
  # ---------------- board support ----------------
  - repo: espressif/arduino-esp32
    section: board-support
    support: full
    license: LGPL-2.1
    en: The Arduino core that actually ships the `nano_nora` board definition — 16 MB flash, OPI PSRAM, DFU upload, plus the "Arduino pin / native GPIO" menu.
    zh: 真正带 `nano_nora` 板定义的 Arduino 核心：16MB Flash、OPI PSRAM、DFU 上传，还有"Arduino 引脚编号 / 原生 GPIO"切换菜单。
  - repo: arduino/arduino-esp32
    section: board-support
    support: none
    license: LGPL-2.1
    en: Arduino's own ESP32 core. It only ships the bare `nora_w10` module variant (4 MB flash, QSPI PSRAM), which is **not** a complete Nano ESP32 board.
    zh: Arduino 自家的 ESP32 核心，只有裸 NORA-W10 模块的 `nora_w10` 变体（4MB Flash、QSPI PSRAM），**不是**完整的 Nano ESP32 板。
  - repo: platformio/platform-espressif32
    section: board-support
    support: full
    license: Apache-2.0
    en: "`board = arduino_nano_esp32` in `platformio.ini` gives an ESP32-S3 / 16 MB setup with the Arduino core."
    zh: 在 `platformio.ini` 里写 `board = arduino_nano_esp32`，即得 ESP32-S3 / 16MB + Arduino 核心的组合。
  - repo: micropython/micropython
    section: board-support
    support: full
    license: MIT
    en: "`ports/esp32/boards/ARDUINO_NANO_ESP32` is the official MicroPython board definition."
    zh: "`ports/esp32/boards/ARDUINO_NANO_ESP32` 就是官方 MicroPython 板定义。"
  - repo: adafruit/circuitpython
    section: board-support
    support: full
    license: MIT
    en: "`ports/espressif/boards/arduino_nano_esp32s3` — CircuitPython with UF2 flashing."
    zh: "`ports/espressif/boards/arduino_nano_esp32s3`，走 UF2 刷入的 CircuitPython。"
  - repo: RIOT-OS/RIOT
    section: board-support
    support: full
    license: LGPL-2.1
    en: "`BOARD=arduino-nano-esp32` in the Makefile."
    zh: Makefile 里 `BOARD=arduino-nano-esp32` 即可。
  - repo: tinygo-org/tinygo
    section: board-support
    support: generic
    license: "BSD-3-Clause"
    en: Go for microcontrollers. No Nano ESP32 target yet — use `-target=esp32s3-generic`.
    zh: 用 Go 写固件。没有 Nano ESP32 专用 target，用 `-target=esp32s3-generic`。
  - repo: esp-rs/esp-hal
    section: board-support
    support: generic
    license: Apache-2.0
    en: Bare-metal Rust HAL. Enable the `esp32s3` feature; there is no board crate for this one.
    zh: 裸机 Rust HAL，开 `esp32s3` feature 即可，没有对应 board crate。
  - repo: espressif/esp-idf
    section: board-support
    support: generic
    license: Apache-2.0
    en: Official Espressif framework. Target `esp32s3`, then set flash size and OPI PSRAM yourself.
    zh: Espressif 官方框架。target 选 `esp32s3`，Flash 大小与 OPI PSRAM 得自己配。
  - repo: Wireless-TAG-Maker/WT_BSP
    section: board-support
    support: generic
    license: unknown
    en: Wireless-TAG's own board support package for ESP-IDF — unified RGB LED, button, display and camera API. Officially targets the TINY series; check `idf.py set-board` before assuming NANO support.
    zh: 启明云端自家的 ESP-IDF 板级支持包：RGB 灯、按键、显示、摄像头统一 API。官方标称覆盖 TINY 系列，NANO 是否在列需看 `idf.py set-board` 的板卡清单。

  # ---------------- ESP-IDF board support ----------------
  - repo: igrr/arduino-nano-esp32
    section: idf
    support: full
    license: unknown
    en: Board support package for ESP-IDF — pins, peripherals and memory defaults wrapped up as a component.
    zh: ESP-IDF 的板级支持包：引脚、外设、内存默认值都封成组件。
  - repo: badlogic/arduino-nano-esp32-esp-idf-template
    section: idf
    support: full
    license: unknown
    en: Minimal ESP-IDF project template already wired for the board — clone and build.
    zh: 已经为这块板接好线的 ESP-IDF 工程模板，clone 下来就能编。

  # ---------------- toolchain ----------------
  - repo: arduino/arduino-cli
    section: toolchain
    support: generic
    license: GPL-3.0
    en: Command-line build, upload and board detection — what the Quickstart runs (`--fqbn esp32:esp32:nano_nora`).
    zh: 命令行编译、上传、板卡探测 —— Quickstart 跑的就是它（`--fqbn esp32:esp32:nano_nora`）。
  - repo: espressif/esptool
    section: toolchain
    support: generic
    license: GPL-2.0
    en: Low-level flasher. Reach for it when a DFU upload gets stuck, or when you need to dump and restore the whole 16 MB flash.
    zh: 底层烧录工具。DFU 上传卡住、或要整片 16MB Flash 备份/恢复时用它。

  # ---------------- firmware ----------------
  - repo: esphome/esphome
    section: firmware
    support: generic
    license: "MIT / GPL-3.0"
    en: YAML-driven firmware for sensors and switches with OTA — no C++ needed.
    zh: 用 YAML 配置传感器/开关的固件，支持 OTA，不用写 C++。
  - repo: wled/WLED
    section: firmware
    support: generic
    license: EUPL-1.2
    en: Addressable-LED effects firmware. The on-board WS2812 counts as an LED strip too.
    zh: WS2812 灯效固件；板载那颗 WS2812 也能当成一条灯带玩。
  - repo: arendst/Tasmota
    section: firmware
    support: generic
    license: GPL-3.0
    en: Universal IoT firmware with a web UI; ESP32-S3 builds are available.
    zh: 通用 IoT 固件，自带 Web UI，有 ESP32-S3 编译目标。
  - repo: 78/xiaozhi-esp32
    section: firmware
    support: generic
    license: MIT
    en: MCP-based voice chatbot firmware. Adding a new board is mostly pin macros.
    zh: 基于 MCP 的语音聊天机器人固件；适配新板基本就是改引脚宏。
  - repo: slvDev/esp32-ai
    section: firmware
    support: generic
    license: MIT
    en: Runs a ~29M-parameter LLM on an ESP32-S3 by keeping weights in flash — this board's 8 MB PSRAM + 16 MB flash is exactly the target hardware.
    zh: 把权重放 Flash，在 ESP32-S3 上跑约 2900 万参数 LLM——这块板的 8MB PSRAM + 16MB Flash 正是它的目标硬件。

  # ---------------- projects ----------------
  - repo: jrodanapolis/WE_AV-ABR_GPC_NanoESP32
    section: projects
    support: full
    license: unknown
    en: Coffee gear-pump controller for a real espresso machine — rare production-style Nano ESP32 codebase.
    zh: 真机咖啡机齿轮泵控制器，少见的"产品级" Nano ESP32 工程。
  - repo: metanav/Nano_ESP32_Linux
    section: projects
    support: full
    license: unknown
    en: Linux running on a Nano ESP32 — a lesson in squeezing every byte.
    zh: 在 Nano ESP32 上跑 Linux，极限压内存的范例。
  - repo: marcinsaj/Flipo-Clock-4x7-Segment-Flip-Disc-Display
    section: projects
    support: full
    license: unknown
    en: Flip-disc clock with firmware, PCB and enclosure.
    zh: 翻页翻牌时钟，固件 + PCB + 外壳全套。
  - repo: ZelTroN-2k3/Doom-Nano-ESP32
    section: projects
    support: full
    license: GPL-3.0
    en: DOOM ported to the Nano ESP32 — a masterclass in RAM/PSRAM budgeting.
    zh: 把 DOOM 移植到 Nano ESP32，内存预算的活教材。
  - repo: Salted-Peanuts/KOTH-Timer
    section: projects
    support: full
    license: unknown
    en: King-of-the-Hill timer for foam-flinging games.
    zh: 战术游戏（发射器对战）用的计时器。
  - repo: kumardeo/arduino-nano-esp32-rgb-color-picker
    section: projects
    support: full
    license: unknown
    en: Minimal, readable example of driving the on-board RGB LED.
    zh: 驱动板载 RGB LED 的最小可读示例。
  - repo: madietlx/photoradar-rs
    section: projects
    support: full
    license: unknown
    en: Rust port of photoRADAR — the only Rust project we found targeting this board.
    zh: photoRADAR 的 Rust 移植，目前唯一能找到的面向这块板的 Rust 项目。
  - repo: yahya2912/arduino-nano-esp32-ov7670
    section: projects
    support: full
    license: unknown
    en: OV7670 camera on a custom PCB — useful wiring reference.
    zh: OV7670 摄像头 + 自制 PCB，接线参考。
  - repo: vifilio/pool-cover-controller
    section: projects
    support: full
    license: unknown
    en: Pool cover controller with current-based obstruction detection.
    zh: 泳池盖控制器，用电流检测做防夹。
  - repo: healerz/remote-pc-power-button
    section: projects
    support: full
    license: unknown
    en: Two boards talking over ESP-NOW to press a PC power button, built with ESPHome.
    zh: 两块板走 ESP-NOW，实现远程按电脑电源键，用 ESPHome 搭。
  - repo: jananica/DepartureMonitorViennaPublicTransit
    section: projects
    support: full
    license: unknown
    en: MicroPython transit departure display.
    zh: MicroPython 写的公交到站显示屏。
  - repo: neilmanfredit/indi-focuser-esp32s3
    section: projects
    support: full
    license: MIT
    en: INDI focuser driver for astrophotography.
    zh: 天文摄影用的 INDI 电调焦驱动。
  - repo: ednieuw/ESP32SerialNTP-BLE-Clock
    section: projects
    support: full
    license: unknown
    en: Feeds a word clock NTP time over BLE serial.
    zh: 通过 BLE 串口给字钟喂 NTP 时间。
  - repo: benb0jangles/Dustduino
    section: projects
    support: full
    license: MIT
    en: Environmental monitor (PM2.5, temperature, humidity) explicitly built on the ESP32-S3-Nano.
    zh: 环境监测（PM2.5、温湿度），明确基于 ESP32-S3-Nano。
  - repo: smolinde/iot-dashboard
    section: projects
    support: full
    license: unknown
    en: IoT dashboard on an ESP32-S3 with a 3.5" SPI TFT.
    zh: ESP32-S3 + 3.5 寸 SPI TFT 的 IoT 面板。
  - repo: Wireless-TAG-Maker/wt9932s3-nano-web-radio
    section: projects
    support: full
    license: unknown
    en: Official ESP-IDF web radio for this exact board — Wi-Fi provisioning over the BOOT button, MP3/AAC/HLS via ESP-GMF, 48 kHz I2S output.
    zh: 官方为这块板写的 ESP-IDF 网络收音机：按 BOOT 进配网，ESP-GMF 解 MP3/AAC/HLS，48kHz I2S 输出。

  - repo: SebastianMalunat/BatMetrics-Hardware
    section: projects
    support: full
    license: MIT
    en: Bat-activity recorder — sensors, BLE and logging on a Nano ESP32, with the hardware design published too.
    zh: 蝙蝠活动记录仪：传感器 + BLE + 存储跑在 Nano ESP32 上，硬件设计也一并开源。
  - repo: Ammaar-Alam/doorUnlocker
    section: projects
    support: full
    license: MIT
    en: Dorm-door opener — gearmotor and a printed spindle driven over Wi-Fi, with a companion website and demo video.
    zh: 宿舍开门器：齿轮电机 + 打印主轴，Wi-Fi 驱动，还配了网站和演示视频。
  - repo: donth77/mets-home-run-apple
    section: projects
    support: full
    license: MIT
    en: Animated "home run apple" scoreboard — Nano ESP32 firmware handles the display and the lift, plus a live site.
    zh: 会动的本垒打苹果计分牌：Nano ESP32 固件负责显示和升降，另配实时网站。

  # ---------------- libraries ----------------
  - repo: FastLED/FastLED
    section: libraries
    support: generic
    license: MIT
    en: Addressable LED driver with solid ESP32-S3 support.
    zh: 可寻址灯带驱动，ESP32-S3 支持良好。
  - repo: adafruit/Adafruit_NeoPixel
    section: libraries
    support: generic
    license: LGPL-3.0
    en: Lighter-weight WS2812 driver.
    zh: 更轻量的 WS2812 驱动。
  - repo: hathach/tinyusb
    section: libraries
    support: generic
    license: MIT
    en: The USB stack under Arduino's HID/MSC support — reach for it when you need composite devices.
    zh: Arduino 的 HID/MSC 底层就是它；要做 USB 复合设备直接用它。

  - repo: 78/esp-wifi-connect
    section: libraries
    support: generic
    license: MIT
    en: Drop-in Wi-Fi provisioning component — the official web-radio demo uses it to serve its BOOT-button setup AP.
    zh: 开箱可用的 Wi-Fi 配网组件 —— 官方 web-radio 例程就是用它做 BOOT 键配网。

  # ---------------- simulation ----------------
  - repo: wokwi/wokwi-boards
    section: simulation
    support: full
    license: unknown
    en: Board definitions for wokwi.com, including `arduino-nano-esp32` — develop and share without hardware.
    zh: wokwi.com 的板定义，含 `arduino-nano-esp32`，没硬件也能开发和分享。

  # ---------------- hardware / docs ----------------
  - repo: arduino/docs-content
    section: hardware
    support: full
    license: CC-BY-SA-4.0
    en: Source of Arduino's official documentation, including the Nano ESP32 pages.
    zh: Arduino 官方文档的源仓库，含 Nano ESP32 相关页面。
  - repo: CMB27/Nano2UNO-Adapter-3V3
    section: hardware
    support: none
    license: CERN-OHL-P-2.0
    en: Adapter that drops a 3.3 V Nano-format board into UNO shields — handy when the shield already exists and you want this board on it.
    zh: 把 3.3V Nano 规格板转成 UNO 外形的转接板，手头已有扩展板时很省事。

  - repo: SooDragon/Geekble-nano-ESP32S3
    section: siblings
    support: full
    license: unknown
    en: Another open Nano-form-factor ESP32-S3 board; `geekble_nano_esp32s3` exists in PlatformIO.
    zh: 又一块 Nano 形 ESP32-S3 开源板，PlatformIO 里有 `geekble_nano_esp32s3` 板定义。
